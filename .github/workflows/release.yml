name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build MCPB artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          make mcpb VERSION="$version" MCPB_STAGE=.mcpb-dist/stage MCPB_FILE=".mcpb-dist/nsmcp_${version}.mcpb"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          check-latest: true

      - name: Build and validate skill artifacts
        run: |
          python -m pip install -r scripts/requirements-skills.txt
          make test-skills skills PYTHON=python SKILLS_OUTPUT=.skills-dist
          cd .skills-dist
          shasum -a 256 -c skill-checksums.txt

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
