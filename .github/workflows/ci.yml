name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
          check-latest: true
      - name: Install skill validation dependency
        run: python -m pip install -r scripts/requirements-skills.txt
      - name: Test and package skills
        run: make test-skills skills PYTHON=python
      - name: Verify skill checksums
        working-directory: dist/skills
        run: sha256sum -c skill-checksums.txt
      - name: Upload skill preview
        uses: actions/upload-artifact@v4
        with:
          name: nowsecure-skills
          path: dist/skills/
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  mcpb:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build MCPB
        run: make mcpb VERSION=0.0.0-test

      - name: Verify MCPB
        run: |
          unzip -t dist/nsmcp.mcpb
          cd dist
          shasum -a 256 -c mcpb-checksums.txt
